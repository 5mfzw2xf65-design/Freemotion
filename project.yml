name: FreeMotion
options:
  bundleIdPrefix: com.freemotion
  deploymentTarget:
    iOS: "16.0"
targets:
  FreeMotion:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: FreeMotionApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freemotion.app
        PRODUCT_NAME: FreeMotion
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: FreeMotion
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FreeMotion video oluşturmak için seçtiğin fotoğrafa erişir."
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

# CI trigger: verify the iOS app build on GitHub Actions.
